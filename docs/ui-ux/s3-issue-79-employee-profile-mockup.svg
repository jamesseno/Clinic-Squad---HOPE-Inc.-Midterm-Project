<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
  <title id="title">Employee list, profile and edit-form mockup</title>
  <desc id="desc">Proposed HR screen board with an employee list, a selected employee profile showing restricted birth date and a job-history access gate, and an employee edit form.</desc>
  <defs><style>
    text{font-family:"DM Sans","Segoe UI",sans-serif;fill:#342a39}.heading{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600}.muted{fill:#786f7b}.small{font-size:12px}.tiny{font-size:10px}.body{font-size:13px}.label{font-size:12px;font-weight:700}.line{stroke:#e9e2dd}
  </style></defs>
  <rect width="1440" height="1020" fill="#faf8f3"/>
  <rect width="1440" height="64" fill="#fffefa"/><path d="M0 63.5H1440" class="line"/>
  <rect x="24" y="13" width="36" height="36" rx="11" fill="#f1eaf2"/><path d="M34 40l8-18 8 18m-13-5h10" fill="none" stroke="#695172" stroke-width="2"/>
  <text x="72" y="40" class="heading" font-size="24">HOPE <tspan fill="#b88d53">·</tspan> PEOPLE</text>
  <text x="1192" y="37" class="small muted">Admin workspace</text>
  <rect x="0" y="64" width="190" height="956" fill="#fffefa"/><path d="M189.5 64V1020" class="line"/>
  <text x="24" y="104" class="tiny muted" letter-spacing="1.2">HR MODULE</text>
  <rect x="14" y="119" width="162" height="36" rx="8" fill="#f1eaf2"/><text x="30" y="143" class="body" font-weight="700">Employees</text>
  <text x="30" y="181" class="body muted">Departments</text><text x="30" y="215" class="body muted">Jobs</text>
  <text x="218" y="101" class="small muted">Human Resources　/　Employees</text>
  <text x="218" y="139" class="heading" font-size="32">Employee workspace</text>
  <text x="218" y="162" class="small muted">Admin list includes status controls; User view contains active records only.</text>
  <rect x="218" y="182" width="1198" height="244" rx="12" fill="#fffefa" stroke="#e9e2dd"/>
  <text x="242" y="216" class="heading" font-size="22">Employees</text>
  <rect x="1112" y="196" width="276" height="36" rx="8" fill="#695172"/><text x="1250" y="219" text-anchor="middle" class="small" fill="#fffefa" font-weight="700">＋ Add employee</text>
  <rect x="242" y="238" width="290" height="34" rx="7" fill="#fffefa" stroke="#e9e2dd"/><text x="258" y="260" class="small muted">⌕  Search employee no. or name</text>
  <rect x="546" y="238" width="126" height="34" rx="7" fill="#fffefa" stroke="#e9e2dd"/><text x="560" y="260" class="small">Gender: All ▾</text>
  <rect x="684" y="238" width="172" height="34" rx="7" fill="#fffefa" stroke="#e9e2dd"/><text x="698" y="260" class="small">Status: Active ▾</text>
  <rect x="242" y="288" width="1146" height="30" rx="5" fill="#faf8f3"/>
  <text x="256" y="308" class="tiny muted" font-weight="700">EMP NO.</text><text x="360" y="308" class="tiny muted" font-weight="700">EMPLOYEE</text><text x="590" y="308" class="tiny muted" font-weight="700">CURRENT JOB</text><text x="810" y="308" class="tiny muted" font-weight="700">DEPARTMENT</text><text x="1008" y="308" class="tiny muted" font-weight="700">STATUS</text><text x="1132" y="308" class="tiny muted" font-weight="700">ACTIONS</text>
  <text x="256" y="346" class="body">E001</text><text x="360" y="346" class="body" font-weight="700">Morgan Lee</text><text x="590" y="346" class="body">Coordinator</text><text x="810" y="346" class="body">Operations</text>
  <rect x="1004" y="329" width="62" height="22" rx="11" fill="#e9f4ed"/><text x="1035" y="344" class="tiny" text-anchor="middle" fill="#32735b" font-weight="700">Active</text>
  <text x="1132" y="346" class="small" fill="#695172">Profile</text><text x="1190" y="346" class="small" fill="#695172">Edit</text><text x="1230" y="346" class="small" fill="#a64e4e">Archive</text>
  <path d="M242 365H1388" class="line"/>
  <text x="256" y="396" class="body">E002</text><text x="360" y="396" class="body" font-weight="700">Taylor Rivera</text><text x="590" y="396" class="body">Analyst</text><text x="810" y="396" class="body">Finance</text>
  <rect x="1004" y="379" width="62" height="22" rx="11" fill="#e9f4ed"/><text x="1035" y="394" class="tiny" text-anchor="middle" fill="#32735b" font-weight="700">Active</text>
  <text x="1132" y="396" class="small" fill="#695172">Profile</text><text x="1190" y="396" class="small" fill="#695172">Edit</text><text x="1230" y="396" class="small" fill="#a64e4e">Archive</text>
  <rect x="218" y="448" width="750" height="536" rx="12" fill="#fffefa" stroke="#e9e2dd"/>
  <text x="244" y="481" class="small" fill="#695172">← Back to employees</text>
  <circle cx="274" cy="534" r="27" fill="#f1eaf2"/><text x="274" y="540" text-anchor="middle" class="label" fill="#695172">ML</text>
  <text x="316" y="531" class="heading" font-size="27">Morgan Lee</text><text x="316" y="554" class="small muted">Employee E001　·　Active</text>
  <rect x="244" y="581" width="698" height="1" fill="#e9e2dd"/>
  <text x="244" y="615" class="heading" font-size="20">Employment</text>
  <text x="244" y="643" class="tiny muted">HIRE DATE</text><text x="244" y="663" class="body">Mar 12, 2022</text>
  <text x="470" y="643" class="tiny muted">SEPARATION DATE</text><text x="470" y="663" class="body">Not separated</text>
  <text x="244" y="710" class="heading" font-size="20">Personal details</text>
  <text x="244" y="740" class="tiny muted">GENDER</text><text x="244" y="760" class="body">Not displayed in compact profile</text>
  <rect x="244" y="782" width="698" height="48" rx="8" fill="#fbf3dd"/>
  <text x="262" y="803" class="small" fill="#8a641c" font-weight="700">Birth date</text><text x="360" y="803" class="small" fill="#5e5362">Sensitive · shown only to authorized HR roles</text>
  <text x="244" y="867" class="heading" font-size="20">Current assignment</text>
  <rect x="244" y="882" width="698" height="72" rx="9" fill="#faf8f3"/>
  <text x="262" y="909" class="body" font-weight="700">Coordinator　·　Operations</text><text x="262" y="934" class="small muted">Effective Jan 15, 2025</text>
  <rect x="992" y="448" width="424" height="536" rx="12" fill="#fffefa" stroke="#e9e2dd"/>
  <text x="1018" y="484" class="heading" font-size="23">Edit employee</text><text x="1018" y="507" class="small muted">Employee number is fixed after creation.</text>
  <text x="1018" y="546" class="label">Employee no.</text><rect x="1018" y="556" width="372" height="38" rx="7" fill="#faf8f3" stroke="#e9e2dd"/><text x="1032" y="581" class="body muted">E001　(read-only)</text>
  <text x="1018" y="626" class="label">First name *</text><rect x="1018" y="636" width="372" height="38" rx="7" fill="#fffefa" stroke="#e9e2dd"/><text x="1032" y="661" class="body">Morgan</text>
  <text x="1018" y="706" class="label">Last name *</text><rect x="1018" y="716" width="372" height="38" rx="7" fill="#fffefa" stroke="#e9e2dd"/><text x="1032" y="741" class="body">Lee</text>
  <text x="1018" y="786" class="label">Gender</text><rect x="1018" y="796" width="372" height="38" rx="7" fill="#fffefa" stroke="#e9e2dd"/><text x="1032" y="821" class="body">Select… ▾</text>
  <text x="1018" y="866" class="label">Birth date　 <tspan fill="#8a641c">Sensitive</tspan></text><rect x="1018" y="876" width="372" height="38" rx="7" fill="#fffefa" stroke="#e9e2dd"/><text x="1032" y="901" class="body muted">Restricted field</text>
  <rect x="1018" y="932" width="96" height="36" rx="8" fill="#fffefa" stroke="#e9e2dd"/><text x="1066" y="955" text-anchor="middle" class="small">Cancel</text>
  <rect x="1124" y="932" width="266" height="36" rx="8" fill="#695172"/><text x="1257" y="955" text-anchor="middle" class="small" fill="#fffefa" font-weight="700">Save changes</text>
  <text x="244" y="973" class="tiny muted">Job history control appears only with the specific View Job History right.</text>
</svg>
